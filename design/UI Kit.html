<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Headroom — UI Kit</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html, body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: #ffffff; color: #0f172a; }
  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
  .meta-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; white-space: nowrap; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .toggle { width: 36px; height: 20px; border-radius: 999px; background: #e2e8f0; position: relative; transition: background 150ms ease; cursor: pointer; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.08); transition: transform 150ms ease; }
  .toggle[data-on="true"] { background: #7c3aed; }
  .toggle[data-on="true"]::after { transform: translateX(16px); }
  .gauge-track { position: relative; height: 14px; border-radius: 999px; }
  .gauge-track > .zone { position: absolute; top: 0; bottom: 0; }
  .gauge-track > .zone:first-child { border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
  .gauge-track > .zone:last-child { border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
  @keyframes hr-spin { to { transform: rotate(360deg); } }
  .spin { animation: hr-spin 700ms linear infinite; }
  html { scroll-behavior: smooth; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Same primitive sources as the app — UI Kit can never drift from the prototype -->
<script type="text/babel" src="src/primitives.jsx"></script>
<script type="text/babel" src="src/compute.jsx"></script>
<script type="text/babel" src="src/layout.jsx"></script>
<script type="text/babel" src="src/result-panel.jsx"></script>

<script type="text/babel" src="src/uikit.jsx"></script>

</body>
</html>
