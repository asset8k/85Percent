<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- 85Percent — logo Option 1 ("The mark") on a brand-violet tile, matching
       design/Logo/exports/85Percent-mark-violet-1200.png: the gradient is
       INVERTED (violet tips dissolve into the #6D28D9 field, materialising to a
       white core) and the stroke is 16.95 mark-space units — identical weight to
       the in-app Wordmark "85" in the sidebar / login (Mark85 strokeWidth=16.95). -->
  <rect width="32" height="32" rx="7" fill="#6D28D9"/>
  <defs>
    <linearGradient id="m" x1="0" y1="42" x2="0" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/><stop offset="0.10" stop-color="#8B5CF6"/><stop offset="0.22" stop-color="#B98AF0"/><stop offset="0.36" stop-color="#EADBFB"/><stop offset="0.50" stop-color="#FFFFFF"/><stop offset="0.64" stop-color="#EADBFB"/><stop offset="0.78" stop-color="#B98AF0"/><stop offset="0.90" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="f" x1="270" y1="372" x2="270" y2="343" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7bdf7"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <g transform="translate(1.51 1.56) scale(0.05774)" stroke-width="16.95" stroke-linecap="round" fill="none">
    <line x1="100" y1="132" x2="248.1" y2="42.24" stroke="url(#m)"/><line x1="232" y1="132" x2="83.9" y2="42.24" stroke="url(#m)"/><line x1="100" y1="132" x2="100" y2="212" stroke="url(#m)"/><line x1="232" y1="132" x2="232" y2="212" stroke="url(#m)"/><line x1="100" y1="212" x2="157" y2="250" stroke="url(#m)"/><line x1="232" y1="212" x2="175" y2="250" stroke="url(#m)"/><line x1="100" y1="292" x2="157" y2="250" stroke="url(#m)"/><line x1="232" y1="292" x2="175" y2="250" stroke="url(#m)"/><line x1="100" y1="292" x2="100" y2="372" stroke="url(#m)"/><line x1="232" y1="292" x2="232" y2="372" stroke="url(#m)"/><line x1="100" y1="372" x2="249.2" y2="457.9" stroke="url(#m)"/><line x1="232" y1="372" x2="82.8" y2="457.9" stroke="url(#m)"/><line x1="270" y1="132" x2="418.1" y2="42.24" stroke="url(#m)"/><line x1="336" y1="92" x2="253.9" y2="42.24" stroke="url(#m)"/><line x1="270" y1="132" x2="270" y2="240" stroke="url(#m)"/><line x1="270" y1="240" x2="336" y2="222" stroke="url(#m)"/><line x1="336" y1="222" x2="402" y2="260" stroke="url(#m)"/><line x1="402" y1="260" x2="402" y2="372" stroke="url(#m)"/><line x1="402" y1="372" x2="252.8" y2="457.9" stroke="url(#m)"/><line x1="270" y1="372" x2="419.2" y2="457.9" stroke="url(#m)"/><line x1="270" y1="372" x2="270" y2="343" stroke="url(#f)"/>
  </g>
